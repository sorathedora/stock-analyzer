name: Backfill data
on:
  workflow_dispatch:
    inputs:
      start:
        description: First date (YYYY-MM-DD)
        required: true
        default: "2020-10-01"
      end:
        description: Last date (YYYY-MM-DD)
        required: true
concurrency:
  group: prices
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"  # show progress in the log as it happens
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: scripts/data_release.sh download
      - run: python -m pipeline backfill "$START" "$END"
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
      # Keep whatever was saved even if the run failed partway.
      - if: success() || failure()
        run: scripts/data_release.sh upload 'prices_*' universe.parquet corporate_actions.parquet nse_pe.parquet 'price_metrics.*' adjustments.csv
