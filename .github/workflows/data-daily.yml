name: Daily data
on:
  schedule:
    # 18:30, 20:00 and 23:00 IST on weekdays. NSE usually posts the day's
    # file by 18:00; the later runs catch late files (and GitHub's cron can
    # start up to an hour late). For a weekend session such as Muhurat
    # trading, start this workflow by hand once NSE has posted the file.
    - cron: "0 13 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
concurrency:
  group: prices
  cancel-in-progress: false
permissions:
  contents: write
  actions: write  # to start the deploy
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"  # show progress in the log as it happens
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: scripts/data_release.sh download
      - id: daily
        run: python -m pipeline daily
        env:
          GOOGLE_SHEET_CSV_URL: ${{ vars.GOOGLE_SHEET_CSV_URL }}
      # Keep whatever was saved even if the run failed partway. A run that
      # found no new trading day (a holiday) has nothing to upload.
      - if: (success() || failure()) && steps.daily.outputs.updated != 'false'
        run: scripts/data_release.sh upload 'prices_*' universe.parquet corporate_actions.parquet nse_pe.parquet 'price_metrics.*' adjustments.csv 'ratios.*' google_history.parquet
      - if: success() && steps.daily.outputs.updated != 'false'
        run: gh workflow run deploy.yml --ref main
