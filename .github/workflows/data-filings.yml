name: Collect filings
on:
  schedule:
    # NSE's feeds only show the latest ~20 filings, so check often.
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: filings
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  filings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: scripts/data_release.sh download filings_index.parquet results.parquet shareholding.parquet
      - run: python -m pipeline filings
      - run: scripts/data_release.sh upload filings_index.parquet results.parquet shareholding.parquet
